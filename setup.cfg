[metadata]
name = ppf.webref
description = Flask app providing a web-interface to a JabRef database
long_description = file: docs/README_pypi.md
long_description_content_type = text/markdown
url = https://github.com/adrianschlatter/ppf.webref/tree/master
project_urls =
    Bug Reports = https://github.com/adrianschlatter/ppf.webref/issues
    Source = https://github.com/adrianschlatter/ppf.webref
author = Adrian Schlatter

license = MIT
license_files = LICENSE

# See https://pypi.python.org/pypi?%3Aaction=list_classifiers
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Information Technology
    Programming Language :: Python :: 3
    Operating System :: OS Independent
keywords = jabref, references, web, server, app

[options]
package_dir = 
    = src
packages = find_namespace:
include_package_data = True
# flask requires >=3.9:
python_requires = >=3.9, <4
install_requires =
    flask>=3.1.1        # requires Werkzeug>=3.1, avoids sec. vulnerability
    flask-sqlalchemy
    flask_talisman
    flask_login
    flask_wtf
    pymysql>=1.1.1      # sql injection vulnerability fixed
    ppf.jabref
    plumbum
    importlib_metadata;python_version<'3.8'

[options.packages.find]
where = src

[options.extras_require]
# List additional groups of dependencies here. You can install these using:
# pip install -e .[dev,test]
test =
    check-manifest
    setuptools>=78.1.1  # security: pip-audit flagged PYSEC-2025-49
    flake8
    pytest
    pytest-cov
dev =
    build
    tox
    twine

[tool:pytest]
testpaths =
    tests
    docs
addopts =
    --cov=ppf.webref
    --cov-report=
    --cov-fail-under=98
    --doctest-glob=*.md

[flake8]
per-file-ignores =
    # imported but unused, import *, undefined name:
    __init__.py: F401, F403, F821
filename =
    */src/*.py
    */docs/*.py
    */tests/*.py
    setup.py

[check-manifest]
ignore =
    tox.ini
    tests
    tests/**
    docs/**
